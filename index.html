<script>
/* ============ storage ============ */
let mem = {};
const store = {
  get(){ try{ return JSON.parse(localStorage.getItem('b447')||'{}'); }catch(e){ return mem; } },
  set(v){ mem = v; try{ localStorage.setItem('b447', JSON.stringify(v)); }catch(e){} }
};
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const shuffle = a => { a = a.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; };
const rint = (a,b) => a + Math.floor(Math.random()*(b-a+1));
const pick = a => a[Math.floor(Math.random()*a.length)];
const f2 = x => (Math.abs(x)<0.005?0:x).toFixed(2);
const f3 = x => x.toFixed(3);
const f4 = x => x.toFixed(4);

/* ============ DATA: True / False ============ */
const TF_PACK = [
 ["An increase in net working capital reduces free cash flow in the year it occurs.",true,"Cash goes into inventory and receivables.","FCF"],
 ["The appropriate beta for valuing a new project is the beta of the firm undertaking it.",false,"Use a pure-play comparable. The firm's own beta describes its existing business, not the project.","Risk"],
 ["It is never optimal to exercise an American call early on a stock that pays no dividends.",true,"A dividend is the only thing that makes early exercise optimal.","Options"],
 ["Using forward prices to forecast revenue and then discounting at the project's WACC overstates the project's value.",false,"It UNDERSTATES value. A forward price is already a certainty equivalent, so a risk-adjusted rate charges for risk twice.","Risk"],
 ["A terminal value computed as a growing perpetuity at the end of year 5 is already stated in today's dollars.",false,"It is dated at year 5 and must still be discounted back five periods.","TV"],
 ["The risk-neutral probability q is the market's best estimate of the probability that the underlying rises.",false,"q is a pricing weight, not a belief. The physical probability never enters the price.","Options"],
 ["Unlevering a comparable firm's equity beta produces a number smaller than that equity beta.",true,"Unlevering strips out financial risk, so the asset beta is always below the equity beta.","Risk"],
 ["A project with a higher IRR than another project necessarily adds more value to the firm.",false,"IRR is a ratio and hides scale. A 40% return on $1 adds less value than 15% on $100.","NPV/IRR"],
 ["Adding an abandonment option makes the project-plus-option less risky than the project alone.",true,"The option truncates the downside. The bundle is safer; the option alone is riskier.","Real options"],
 ["Net working capital committed to a project has no tax consequences.",true,"NWC is a timing effect only. Its cost is the time value of money on the tied-up balance.","FCF"],
 ["Under MM with no corporate taxes, a firm can lower its WACC by issuing debt and repurchasing equity.",false,"The cost of equity rises exactly enough to offset the heavier debt weight. WACC is flat.","Cap structure"],
 ["A cash flow whose variation is entirely idiosyncratic should be discounted at the risk-free rate.",true,"Beta is zero, so no risk premium is earned no matter how volatile the cash flow is.","Risk"],
 ["Increasing a binomial tree from 2 steps to 20 steps gives a more precise estimate of the same value.",true,"More steps converge toward Black-Scholes; they do not change the underlying value.","Options"],
 ["Interest expense is excluded from free cash flow, but the interest tax shield is still captured in the tax line of the FCF build.",false,"Taxes in FCF are computed as if unlevered. The shield lives in the discount rate, or under APV in a separate term.","FCF"],
 ["Black-Scholes is an appropriate method for valuing an option to abandon a project at any point over the next three years.",false,"Abandonment at any point is American. Black-Scholes cannot handle early exercise. Use a binomial tree.","Real options"],
 ["The main reason the long-run growth rate g must be small is mathematical: the perpetuity formula breaks down as g approaches r.",false,"The reason is economic: saturation and competition. No firm outgrows the economy forever.","TV"],
 ["Under MM with corporate taxes, firm value rises as leverage rises.",true,"V_L = V_U + t_C D under the stated assumptions.","Cap structure"],
 ["A zero-NPV project destroys shareholder value and should be rejected.",false,"A zero-NPV project earns exactly its risk-adjusted required return. It is acceptable.","NPV/IRR"],
 ["Observed bankruptcy costs are large enough to explain why most US public firms carry so little debt.",false,"Crane's point exactly: bankruptcy costs are far too small, and roughly 30% of US public firms have zero leverage.","Cap structure"],
 ["If land the firm already owns will be used for a project, it should enter the analysis at its current market value.",true,"Opportunity cost at market value, never historical cost.","FCF"],
 ["The exit multiple method and the growing perpetuity method are fundamentally different approaches to terminal value.",false,"They are the same thing. The multiple equals 1/(r-g).","TV"],
 ["A call option's value is at least the maximum of zero and the underlying price minus the strike.",true,"Otherwise you could buy the option, exercise, and arbitrage the difference.","Options"],
 ["In a recombining binomial tree, N steps produce 2 to the power N terminal nodes.",false,"Recombination gives N+1 terminal nodes, which is why trees stay tractable.","Options"],
 ["In a growth-option structure, the first project is itself the option being valued.",false,"The first project is the PREMIUM. The option is the right to launch the second.","Real options"],
 ["A dual-fuel power plant's switching flexibility is free, because no cash is paid at the moment of switching.",false,"The premium was paid at construction, since a dual-fuel plant costs more to build than a single-fuel one.","Real options"],
 ["The growing perpetuity formula for terminal value requires that g be less than r.",true,"Otherwise the denominator is zero or negative.","TV"],
 ["Under APV you value the project as if all-equity financed and then add the value of financing side effects.",true,"That is the definition of adjusted present value.","Cap structure"],
 ["For an all-equity firm, the equity beta is the asset beta.",true,"No leverage to strip out, so the equity beta is the asset beta.","Risk"],
 ["When a firm uses an asset it already owns in a project, no cash leaves the firm, so there is no cost to include.",false,"Using the asset means giving up the ability to sell or lease it. That forgone value is a real cost at market value.","FCF"],
 ["Expected bankruptcy cost equals the cost of bankruptcy multiplied by the probability of bankruptcy.",true,"Both terms matter; leverage raises the probability, and the cost term is what makes the probability matter.","Cap structure"],
];
const TF_EXTRA = [
 ["Money already spent on a feasibility study last year should be included in the project's cash flows if the amount is large.",false,"Sunk. It is unchanged by the decision, so it is out no matter how big.","FCF"],
 ["If a new store steals sales from an existing store, the lost sales should be subtracted from the project's cash flows.",true,"Cannibalization is incremental to the firm, so it enters as a negative.","FCF"],
 ["Corporate overhead that is allocated to a project but does not change in total should be included in FCF.",false,"Not incremental. The word 'allocated' is the tell.","FCF"],
 ["Depreciation is a cash expense, so it is subtracted from NOPAT to get free cash flow.",false,"It is non-cash. It only matters because it lowers taxes, so you subtract it to find EBIT, tax it, then ADD it back.","FCF"],
 ["Principal repayment on project debt is excluded from FCF, because including it would double count the financing.",true,"Financing flows (interest, principal, dividends, share issues) are all out.","FCF"],
 ["After-tax salvage equals the sale price minus the tax rate times (sale price minus book value).",true,"After-tax salvage = P - t(P - B). If fully depreciated, B is zero and the whole price is taxable.","FCF"],
 ["A 12x terminal exit multiple on cash flow implies a view that r minus g is about 8.3 percent.",true,"Multiple = 1/(r-g). 1/12 is about 8.3%. A multiple is a view on r and g in disguise.","TV"],
 ["Large positive NPV on a project is strong evidence the project is great and should be accepted without further checks.",false,"A large positive NPV is a reason to check your model. If you cannot name the competitive advantage and the specific non-market input, the number is probably wrong.","NPV/IRR"],
 ["For a 25-year project, the CAPM risk-free rate should be a long-run Treasury rate, not a short-term bill.",true,"Match the maturity of the cash flows. Never use a trailing window contaminated by one episode.","TV"],
 ["IRR is additive across projects, so the IRR of a portfolio is the sum of the IRRs of its projects.",false,"NPV is additive and reflects scale. IRR is not additive.","NPV/IRR"],
 ["Because an option can lose at most its premium, it is a low-risk asset and should be discounted at a low rate.",false,"'Most you can lose is the premium' is not 'low risk'. An expired option returns -100%. Its risk changes continuously, so no single discount rate works.","Options"],
 ["Pricing an option with the binomial model requires an estimate of the stock's expected return.",false,"It needs only u, d and the risk-free rate. The expected return (and any risk premium) never enters.","Options"],
 ["All else equal, higher volatility of the underlying raises the value of an option.",true,"Option value requires volatility. With zero volatility, flexibility is worth zero.","Options"],
 ["In the four-step binomial procedure, payoffs are computed at every node, then q is found.",false,"Payoffs go at the FINAL nodes only. Interior nodes are filled by working backward with q.","Options"],
 ["The risk-neutral probability q is computed as (1 + r_f - d) / (u - d).",true,"q = (r* - d)/(u - d). It is just where the risk-free factor sits between d and u.","Options"],
 ["An option to expand is a put option.",false,"Expansion is a CALL: you exercise when things go WELL, by paying the expansion cost K to get the value S of the extra capacity.","Real options"],
 ["An option to abandon is a put option, where the strike is the salvage or exit value.",true,"You exercise when things go badly, by walking away and receiving K.","Real options"],
 ["A real option is valuable whenever a decision can be made later, even if there is no uncertainty at all.",false,"Two ways there is no value: no decision remains, or no volatility. No volatility means the option is worth zero.","Real options"],
 ["If the first project in a growth-option structure has negative NPV, it should never be launched.",false,"Launch project one if NPV(project one) + value of the project-two call is greater than zero.","Real options"],
 ["A naive decision tree that discounts a downside-protected payoff at the project's cost of capital understates the option's value.",true,"Downside protection makes the payoff safer, so the project's own cost of capital is too high. The tree understates the option.","Real options"],
 ["A manager who makes deliberately conservative forecasts is acting in shareholders' interest.",false,"Conservative means wrong. Shading down rejects good projects, shading up accepts bad ones. Crane wants an unbiased expectation.","Crane"],
 ["Taking on more debt raises the cost of equity because the same swings in asset value fall on a smaller equity base.",true,"Lenders hold a fixed claim paid first, so the swing lands on equity.","Cap structure"],
 ["With corporate taxes and perpetual debt, the cost of capital r_L = r_A(1 - t_C D/V) falls as leverage rises.",true,"That is the WACC form of V_L = V_U + t_C D.","Cap structure"],
 ["APV is required when the debt amortizes on a fixed schedule, because WACC assumes a stable target D/V.",true,"WACC applies one rate to every period. Changing leverage or tax rate means value unlevered and add the period-by-period shields.","Cap structure"],
 ["Trade-off theory predicts 100 percent debt if only taxes are considered, and zero debt if only bankruptcy costs are considered.",true,"Only both ingredients together give an interior optimum.","Cap structure"],
 ["Under MM with no taxes, V_L = V_U regardless of the debt-equity mix.",true,"Pumpkin pie: slicing differently does not make more pie. The asset does not care who financed it.","Cap structure"],
 ["At the down node of an abandonment tree, you abandon if the exit value exceeds the continuing value of the project.",true,"The option pays max(0, exit value - project value). Down node: exit 44 vs value 35 pays 9.","Real options"],
 ["A forward price that is below the expected future spot price reflects the time value of money.",false,"No cash changes hands at signing, so time value is not involved. The gap is the risk premium.","Risk"],
 ["In the certainty equivalent approach, the 'b' used is a cash flow beta measured in dollars (covariance with the market return over market variance).",true,"Not a return beta. CE = E[CF] - b(E[r_m] - r_f), then PV = CE/(1 + r_f).","Risk"],
 ["A diversified shareholder demands a risk premium for a project's idiosyncratic risk, such as the outcome of a binary FDA decision.",false,"Diversifiable risk is free to bear, so nobody pays you to bear it. Discount at r_f if its beta is zero.","Risk"],
 ["Terminal value computed at the end of year T is still discounted back T periods.",true,"TV is dated at T. It gets discounted like any cash flow at time T.","TV"],
 ["Both risk adjustments, a higher discount rate and a haircut on the cash flows, can be applied together for extra safety.",false,"Risk goes in the numerator OR the denominator, never both. Doing both is double discounting and understates value.","Risk"],
];
const TF = [].concat(
  TF_PACK.map((x,i)=>({id:'p'+(i+1),q:x[0],a:x[1],why:x[2],tag:x[3],src:'pack'})),
  TF_EXTRA.map((x,i)=>({id:'x'+(i+1),q:x[0],a:x[1],why:x[2],tag:x[3],src:'extra'}))
);

/* ============ DATA: Real option identification ============ */
const OPT_TYPES = {
  delay:["Timing / delay","Call"], abandon:["Abandon","Put"], expand:["Expand","Call"], contract:["Contract","Put"],
  growth:["Growth / follow-on","Call"], switch:["Switch","Call on the spread"], extend:["Extend / renew","Call"],
  none:["No option","-"], zero:["Option worth ~0","-"]
};
const OPTS = [
 ["A pharma company holds a patent with 8 years left and can build the manufacturing plant whenever it chooses before expiry.","delay","S: PV of the developed drug business. K: plant construction cost. Call (American). Dividend analogue: the patent clock, since each year of waiting permanently destroys a year of monopoly profits."],
 ["An airline leases 20 planes with a clause allowing it to hand them back to the lessor after year 3, penalty free.","abandon","S: going-concern value of operating the planes. K: PV of the lease payments avoided by walking away. Put. You exercise when flying is losing money."],
 ["A software firm launches a first product it expects to lose money on. The product establishes the platform a much larger second product would run on.","growth","S: PV of the second product's cash flows. K: investment to launch the second product. Call. The first product is the PREMIUM, not the option."],
 ["A power plant is built to burn either natural gas or fuel oil, and can switch whenever the price spread favors one.","switch","S: value of running on the cheaper fuel. K: value on the current fuel plus switching cost. Call on the spread (a strip of options). The premium was paid at construction."],
 ["A mine is designed so a second processing line can be added later for $40M, raising output 50 percent.","expand","S: PV of the cash flows from the extra 50 percent of output. K: $40M. Call."],
 ["A restaurant chain signs a 10-year fixed-rent lease. No early termination, no renewal option, no expansion, rent locked at signing.","none","No option. Nothing is left to decide. Everything is locked at signing, so ordinary DCF is the right tool. This is Crane's 'optionality as a crutch' warning in test form."],
 ["A manufacturer's supply contract lets it cut order volume by up to 50 percent on 90 days notice if demand falls.","contract","S: value of the output from the marginal 50 percent. K: input costs on that 50 percent, released. Put. Exercise when K exceeds S."],
 ["A biotech can license its compound to a larger partner for a pre-agreed fee if its own trials disappoint.","abandon","S: value of developing the compound alone. K: the pre-agreed licence fee. Put. You take the fee when your own trials go badly."],
 ["A retailer signs a lease that includes the right to renew for five more years at a rent fixed today.","extend","S: market value of the leasehold in five years. K: the rent fixed today. Call. Renew only if market rents have risen. A timing call."],
 ["A developer can build on a vacant lot now or in a year. Property values in this market have been flat for thirty years with negligible volatility.","zero","A real option worth approximately zero. The decision exists, so there is an option, but with no volatility there is no value. This is a different failure from 'no option'."],
 ["A shipping firm can sell a vessel for scrap if freight rates collapse.","abandon","S: going-concern value of the vessel earning freight. K: scrap value. Put. Exercise when things go badly."],
 ["An oil company buys acreage leases that give it the right, but not the obligation, to drill any time in the next 5 years.","delay","S: PV of the developed field. K: drilling cost. Call (American). Dividend analogue: production and revenue forgone while waiting."],
 ["A utility signs a take-or-pay contract to deliver a fixed quantity at a fixed price for 10 years, with no volume flexibility and no early exit.","none","No option. All terms are fixed at signing, so DCF applies."],
];

/* ============ DATA: concept cards ============ */
const CARDS = [
 ["Free cash flow excludes interest even though interest is a real cash payment. Explain why.","Because financing is already priced into the discount rate. WACC reflects the cheapness of debt, so subtracting interest from the cash flows as well charges for the debt twice. Taxes in an FCF build are computed as though the firm has no debt at all."],
 ["A forward price and an expected spot price differ. What does the difference represent, and what does it imply for the discount rate?","The gap is the risk premium, not time value, since no cash changes hands at signing. The forward is already a certainty equivalent, so discount forward-based revenue at the risk-free rate. Using a risk-adjusted rate takes the premium twice and understates value."],
 ["Why can an option's expected payoff not be discounted at a single rate?","Because the option's risk changes continuously as the underlying moves. Deep in the money it behaves like the stock; far out of the money it is heavily levered. No single beta, so no single defensible discount rate."],
 ["Distinguish \"there is no option here\" from \"the option is worth nothing.\"","\"No option\": no decision remains open, so ordinary DCF is correct and no value should be added. \"Worth nothing\": a decision exists but the underlying has no volatility, so flexibility has no value. Both are legitimate conclusions."],
 ["In Arundel, why divide total value by all 99 films rather than the 26 you would actually exercise?","You must buy every right and do not know in advance which films will succeed. Dividing by 26 assumes perfect foresight. The 26 is a forecast of how many you expect to exercise, not a set you can select in advance."],
 ["State a condition under which WACC is invalid and APV is required.","WACC applies one rate to every period, which requires a stable target D/V. If debt amortizes on a fixed schedule, or the tax rate changes between years, capital structure is not stable. Value the project unlevered and add period-by-period tax shields. That is APV."],
 ["Why is the risk-neutral probability not a probability?","It is the position of the risk-free growth factor on the interval between d and u, not anyone's belief. It is the weight that makes the no-arbitrage algebra work. The true probability is typically different and the option price does not depend on it."],

function solveA(s){
  const life = s.life||s.N, dep = s.depBase/life, rows=[]; let pvSum=0;
  const book = s.depBase - dep*s.N;

  const kind = pick(['n','n','n','n','both','low']);
  let X = Math.round(Vd + (Vu-Vd)*pick([0.35,0.45,0.55]));
  if(kind==='both') X = Math.ceil(Vu)+rint(1,3);
  if(kind==='low') X = Math.max(1,Math.floor(Vd)-rint(1,3));
  return {V0,u,d,rf,fac:r4(1/(1+rf)),X,stat: staticNPV!=null?staticNPV:-(rint(5,50)/10), name:pick(NAMES)};
}
const PACK_B = {
  brazos:{name:"Brazos Valley Cold Storage",V0:50,u:1.30,d:0.70,rf:0.05,fac:0.9524,X:44,stat:-2.9},
  brewery:{name:"Cypress Creek Brewery Expansion",V0:40,u:1.35,d:0.60,rf:0.05,fac:0.9524,X:30,stat:-2.1},
  lng:{name:"Port Arthur LNG Terminal Unit",V0:60,u:1.25,d:0.55,rf:0.06,fac:0.9434,X:50,stat:-3.4},
  wind:{name:"Bayou Wind Farm",V0:30,u:1.10,d:0.70,rf:0.04,fac:0.9615,X:35,stat:-4.2},
  gulf:{name:"Gulf Coast Data Center",V0:32,u:1.40,d:0.65,rf:0.06,fac:0.9434,X:26,stat:-0.87}
};
function solveB(s){
  const Vu=s.V0*s.u, Vd=s.V0*s.d;
  const pu=Math.max(0,s.X-Vu), pd=Math.max(0,s.X-Vd);
  const q=(1+s.rf-s.d)/(s.u-s.d);
  const opt=(q*pu+(1-q)*pd)*s.fac;
  return {Vu,Vd,pu,pd,q,opt,total:s.stat+opt};
}

function tfStats(){
  const s=store.get(); const seen=s.seen||{}; let r=0,w=0; Object.values(seen).forEach(v=>{r+=v.r;w+=v.w;});
  const missed=Object.keys(s.missed||{}).filter(id=>TF.some(q=>q.id===id));
  return {r,w,missed,mastered:Object.values(seen).filter(v=>v.r>=2&&v.r>v.w).length};
}
function tfStart(mode){
  let pool;
  if(mode==='all') pool=TF; else if(mode==='pack') pool=TF.filter(q=>q.src==='pack'); else if(mode==='extra') pool=TF.filter(q=>q.src==='extra');
  else if(mode==='missed'){ const m=tfStats().missed; pool=TF.filter(q=>m.includes(q.id)); }
  else if(mode==='mock') pool=TF;
  else if(mode.startsWith('tag:')) pool=TF.filter(q=>q.tag===mode.slice(4));
  let queue=shuffle(pool); if(mode==='mock') queue=queue.slice(0,6);
  if(!queue.length) return;
  Object.assign(S.tf,{mode,queue,i:0,ans:null,right:0,wrong:[],total:queue.length}); render();
}
function tfAnswer(v){
  const t=S.tf; if(t.ans!==null) return;
  const q=t.queue[t.i]; t.ans=v; const ok=(v===q.a);
  const s=store.get(); s.seen=s.seen||{}; s.missed=s.missed||{};
  const e=s.seen[q.id]||{r:0,w:0};
  if(ok){ t.right++; e.r++; delete s.missed[q.id]; } else { t.wrong.push(q); e.w++; s.missed[q.id]=1; }
  s.seen[q.id]=e; store.set(s); render();
}

function labCheck(part){
  const L=S.lab; let fields, sol, dec, tol=0.1;
  if(part==='A'){ sol=solveA(L.A); fields=[['la_t0',sol.t0],['la_f1',sol.rows[0].fcf],['la_fN',sol.rows[L.A.N-1].fcf],['la_npv',sol.npv]]; dec=sol.npv>=0?'y':'n'; }
  else { sol=solveB(L.B); fields=[['lb_pu',sol.pu,tol],['lb_pd',sol.pd,tol],['lb_q',sol.q,0.003],['lb_opt',sol.opt,0.08],['lb_tot',sol.total,0.1]]; dec=sol.total>=0?'y':'n'; }
  let right=0;
  fields.forEach(f=>{ const el=document.getElementById(f[0]); const v=num(f[0]); const t=f[2]||tol; const ok=!isNaN(v)&&Math.abs(v-f[1])<=t; el.className=ok?'ok':'bad'; if(ok) right++; });
  const d=document.getElementById(part==='A'?'la_dec':'lb_dec'); const dok=d.value===dec; d.className=d.value?(dok?'ok':'bad'):''; if(dok) right++;
  const n=fields.length+1;
  let box=document.getElementById('labmsg'); if(!box){ box=document.createElement('div'); box.id='labmsg'; box.className='fb'; document.querySelector('.card .row').after(box); }
  box.className='fb '+(right===n?'ok':'note');
  box.innerHTML=`<b class="h">${right} of ${n} correct</b>${right===n?'Nice. Now say the comparison out loud in one sentence.':'Red fields are off. Tap Show full solution to see the labeled build.'}`;
}

/* ============ main render ============ */
function render(){
  renderNav();
  const a=$('#app'); let h='';
  if(S.tab==='learn') h=`<h2>Learn</h2><p class="muted" style="margin-top:-6px">The whole course, boiled down. Open a section, read it, then go quiz.</p>`+LEARN.map((x,i)=>`<details ${i===0?'open':''}><summary>${x[0]}</summary><div class="body">${x[1]}</div></details>`).join('');
  else if(S.tab==='tf') h=renderTF();
  else if(S.tab==='opt') h=renderOpt();
  else if(S.tab==='cards') h=renderCards();
  else if(S.tab==='lab') h=renderLab();
  else if(S.tab==='sheet') h=`<h2>Formula sheet</h2><p class="muted noprint" style="margin-top:-6px">Everything on one scroll. You get a double-sided sheet: write the important ones by hand (writing it is half the studying).</p><div class="sheet card">${SHEET}</div><button class="btn noprint" onclick="window.print()">Print this</button>`;
  a.innerHTML=h;
}

/* ============ events ============ */
document.addEventListener('click',e=>{
  const g=(a)=>e.target.closest('['+a+']');
  let el;
  if(el=g('data-nav')){ nav(el.dataset.nav); return; }
  if(el=g('data-tfmode')){ tfStart(el.dataset.tfmode); return; }
  if(el=g('data-tfhome')){ e.preventDefault(); S.tf.mode=null; render(); return; }
  if(el=g('data-tf')){ tfAnswer(el.dataset.tf==='1'); return; }
  if(el=g('data-tfnext')){ tfNext(); return; }
  if(el=g('data-reset')){ e.preventDefault(); if(confirm('Reset all T/F progress?')){ store.set({}); S.tf.mode=null; render(); } return; }
  if(el=g('data-optans')){ const o=S.opt; if(o.ans!==null) return; o.ans=el.dataset.optans; const it=OPTS[o.queue[o.i]]; if(o.ans===it[1]) o.right++; else o.wrong++; render(); return; }
  if(el=g('data-optnext')){ S.opt.i++; S.opt.ans=null; render(); return; }
  if(el=g('data-optreset')){ S.opt.queue=null; render(); return; }
  if(el=g('data-flip')){ S.cards.flip=!S.cards.flip; render(); return; }
  if(el=g('data-cardgot')){ const c=S.cards; c.got++; c.i++; c.flip=false; render(); return; }
  if(el=g('data-cardagain')){ const c=S.cards; c.queue.push(c.queue[c.i]); c.i++; c.flip=false; render(); return; }
  if(el=g('data-cardsreset')){ S.cards.queue=null; render(); return; }
  if(el=g('data-labsrc')){ S.lab.src=el.dataset.labsrc; labNew(); return; }
  if(el=g('data-labpart')){ S.lab.part=el.dataset.labpart; S.lab.shown=false; render(); return; }
  if(el=g('data-labnew')){ labNew(); return; }
  if(el=g('data-labshow')){ S.lab.shown=true; const keep={}; document.querySelectorAll('.field input,.field select').forEach(i=>keep[i.id]=[i.value,i.className]); render(); Object.keys(keep).forEach(k=>{const i=document.getElementById(k); if(i){i.value=keep[k][0]; i.className=keep[k][1];}}); return; }
  if(el=g('data-labcheck')){ labCheck(el.dataset.labcheck); return; }
});
document.addEventListener('keydown',e=>{
  if(S.tab!=='tf'||!S.tf.mode||e.target.matches('input,select,textarea')) return;
  const k=e.key.toLowerCase();
  if(S.tf.i<S.tf.queue.length){
    if(S.tf.ans===null){ if(k==='t') tfAnswer(true); else if(k==='f') tfAnswer(false); }
    else if(k===' '||k==='enter'||k==='n'){ e.preventDefault(); tfNext(); }
  }
});
$('#theme').addEventListener('click',()=>{
  const r=document.documentElement; const dark=getComputedStyle(r).getPropertyValue('--bg').trim()==='#0a1424';
  r.dataset.theme=dark?'light':'dark'; try{ const s=store.get(); s.theme=r.dataset.theme; store.set(s);}catch(e){}
});
(function init(){
  const s=store.get(); if(s.theme) document.documentElement.dataset.theme=s.theme;
  if(s.tab && TABS.some(t=>t[0]===s.tab)) S.tab=s.tab;
  render();
})();
</script>
</body>
